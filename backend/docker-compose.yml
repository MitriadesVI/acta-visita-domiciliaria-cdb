services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acta}
      POSTGRES_DB: ${POSTGRES_DB:-acta}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No exponer el puerto al exterior: solo accesible dentro de la red docker.
    expose:
      - "5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - minio
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - minio

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
